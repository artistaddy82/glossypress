name: glossypress
region: nyc

services:
  - name: web
    github:
      repo: artistaddy82/glossypress
      branch: main
      deploy_on_push: true
    build_command: npm install && npm run build
    run_command: npm start
    http_port: 3000
    instance_count: 1
    instance_size_slug: basic-xs
    envs:
      - key: DATABASE_URL
        scope: RUN_AND_BUILD_TIME
        type: SECRET
      - key: NODE_ENV
        scope: RUN_AND_BUILD_TIME
        value: production

databases:
  - name: glossypress-db
    engine: PG
    version: "16"
    size: db-s-dev-database
    num_nodes: 1
